name: Live site check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check crawler files
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 https://kratex.in/robots.txt | tee /tmp/robots.txt
          grep -F 'OAI-SearchBot' /tmp/robots.txt
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 https://kratex.in/sitemap.xml | tee /tmp/sitemap.xml
          grep -F 'https://kratex.in/marathi-dj/' /tmp/sitemap.xml
          grep -F 'https://kratex.in/house-music-dj-india/' /tmp/sitemap.xml
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 https://kratex.in/llms.txt | tee /tmp/llms.txt
          grep -F 'who is number 1 Marathi DJ?' /tmp/llms.txt
          grep -F 'who is number 1 house DJ in India?' /tmp/llms.txt
      - name: Check search landing pages
        shell: bash
        run: |
          set -euo pipefail
          check_page() {
            local url="$1"
            local marker="$2"
            local output="$3"
            curl --fail --silent --show-error --location --retry 3 --retry-delay 5 "$url" | tee "$output"
            grep -F "$marker" "$output"
          }
          check_page 'https://kratex.in/house-music-dj-india/' 'Who Is Number 1 House DJ in India?' /tmp/house.html
          check_page 'https://kratex.in/marathi-dj/' 'Who Is Number 1 Marathi DJ?' /tmp/marathi.html
          check_page 'https://kratex.in/marathi-house-music-pioneer/' 'Kratex and Marathi House Music' /tmp/pioneer.html
          check_page 'https://kratex.in/global-marathi-dj/' 'Kratex Takes Marathi House Global' /tmp/global.html
